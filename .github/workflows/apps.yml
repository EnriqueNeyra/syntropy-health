name: Apps

# The Mac (.dmg) and Windows (setup .exe) apps, built and then used as people would: the command-line program answers,
# the app opens its window (or only its menu bar or tray icon at login), and on Windows the setup program installs and
# uninstalls. CI runs this on every pull request and push to main, so a change anywhere (the server is bundled in the
# apps) is checked in the apps before it merges; the run's artifacts are the apps to try. The Release workflow runs it
# on a tag, where the Mac app is signed and notarized when the `release` environment has the certificates
# (desktop.yml lists them); other builds are ad-hoc signed. Only a tag's apps carry the relay key (scripts/release_key.py).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest      # Apple silicon
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.15"
          enable-cache: false      # this job signs things: nothing from a shared cache
      - name: The versions in uv.lock, each checked against its hash
        shell: bash
        run: |
          uv export --frozen --no-dev --extra desktop --no-emit-project --no-header -o "$RUNNER_TEMP/locked.txt"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/locked.txt"
      - name: The relay key (scripts/release_key.py)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/release_key.py
        env:
          SYNTROPY_RELAY_KEY: ${{ secrets.SYNTROPY_RELAY_KEY }}
      - name: Import the signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build
        env:
          PYTHON: python
          SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: desktop/build-mac.sh
      # Without this a release whose secrets had gone missing would come out ad-hoc signed and green: every installed app
      # would then refuse the update, and Gatekeeper every new download.
      - name: A release's Mac app is signed and notarized
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'EnriqueNeyra/syntropy-health'
        run: |
          dmg="$(ls desktop/dist/*.dmg)"
          codesign --verify --deep --strict -R='anchor apple generic and identifier "io.syntropyhealth.desktop" and certificate leaf[subject.OU] = "RJ2YA2S2C8"' "desktop/dist/Syntropy Health.app"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg"
      - name: Smoke test
        run: |
          "desktop/dist/Syntropy Health.app/Contents/MacOS/Syntropy Health" version
          # A built app can encrypt: PyInstaller found the SQLCipher binding, and the first bytes of a new database aren't SQLite's name.
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | SYNTROPY_DATA_DIR="$RUNNER_TEMP/data-encrypted" "desktop/dist/Syntropy Health.app/Contents/MacOS/Syntropy Health" mcp >/dev/null
          [ "$(head -c 15 "$RUNNER_TEMP/data-encrypted/syntropy.db")" != "SQLite format 3" ] && [ -s "$RUNNER_TEMP/data-encrypted/syntropy.db" ]
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | SYNTROPY_DATA_DIR="$RUNNER_TEMP/data" "desktop/dist/Syntropy Health.app/Contents/MacOS/Syntropy Health" mcp | grep -q get_health_summary
      # The app itself: its server answers and it opens with its window, in the Dock ("0 1": a regular app, a window
      # on screen). Opened at login (--background) it's in the menu bar only ("1 0": an accessory app, no window).
      - name: Smoke test the app window
        run: |
          app="desktop/dist/Syntropy Health.app/Contents/MacOS/Syntropy Health"
          state() {     # "<activation policy> <whether a window of the app is on screen>"
            python - "$1" <<'PY'
          import sys, AppKit, Quartz
          pid = int(sys.argv[1])
          app = AppKit.NSRunningApplication.runningApplicationWithProcessIdentifier_(pid)
          windows = Quartz.CGWindowListCopyWindowInfo(Quartz.kCGWindowListOptionOnScreenOnly, Quartz.kCGNullWindowID) or []
          shown = any(w.get("kCGWindowOwnerPID") == pid and w.get("kCGWindowLayer") == 0 for w in windows)
          print(app.activationPolicy() if app else -1, int(shown))
          PY
          }
          check() {     # check <expected state> <data folder> [arguments]
            want=$1 data=$2; shift 2
            SYNTROPY_DATA_DIR="$data" "$app" "$@" & pid=$!
            ok=
            for _ in $(seq 90); do
              sleep 1
              kill -0 $pid 2>/dev/null || break
              port=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["port"])' "$data/desktop.json" 2>/dev/null || echo 8000)
              curl -sf "http://127.0.0.1:$port/health" >/dev/null || continue
              [ "$(state $pid)" = "$want" ] && { ok=1; break; }
            done
            if [ -n "$ok" ]; then sleep 5; [ "$(state $pid)" = "$want" ] || ok=; fi
            got=$(state $pid)
            cat "$data/desktop.log" 2>/dev/null || true
            kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true
            [ -n "$ok" ] || { echo "::error::Expected '$want', got '$got' (args: $*)"; exit 1; }
          }
          check "0 1" "$RUNNER_TEMP/app-window"
          check "1 0" "$RUNNER_TEMP/app-background" --background
      # With a real web view and the real swap script: other sites in the window, start-up problems, going back.
      - name: The window's and the updater's tests
        run: |
          uv export --frozen --only-group dev --no-emit-project --no-header -o "$RUNNER_TEMP/dev.txt"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/dev.txt"
          python -m pytest -q tests/test_desktop_window.py tests/test_desktop_start.py tests/test_desktop_updater.py
      # Reading a photographed lab report with what macOS has built in, from the source and from the app as packaged.
      - name: Reading a photographed lab report
        run: |
          python -m pytest -q tests/test_lab_ocr.py
          python -c "from app.services import ocr; assert ocr.engine() == 'vision', ocr.engine()"
          SYNTROPY_DATA_DIR="$RUNNER_TEMP/ocr-data" python scripts/check_app_ocr.py "desktop/dist/Syntropy Health.app/Contents/MacOS/Syntropy Health" vision
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: desktop/dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.15"
          enable-cache: false      # this job signs things: nothing from a shared cache
      - name: The versions in uv.lock, each checked against its hash
        shell: bash
        run: |
          uv export --frozen --no-dev --extra desktop --no-emit-project --no-header -o "$RUNNER_TEMP/locked.txt"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/locked.txt"
      - name: The relay key (scripts/release_key.py)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/release_key.py
        env:
          SYNTROPY_RELAY_KEY: ${{ secrets.SYNTROPY_RELAY_KEY }}
      - run: python -m PyInstaller --noconfirm --clean --distpath desktop/dist --workpath desktop/build desktop/syntropy-health.spec
      - name: Smoke test
        shell: bash
        run: |
          "desktop/dist/Syntropy Health/syntropy-health.exe" version
          # A built app can encrypt: PyInstaller found the SQLCipher binding, and the first bytes of a new database aren't SQLite's name.
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | SYNTROPY_DATA_DIR="$RUNNER_TEMP/data-encrypted" "desktop/dist/Syntropy Health/syntropy-health.exe" mcp >/dev/null
          [ "$(head -c 15 "$RUNNER_TEMP/data-encrypted/syntropy.db")" != "SQLite format 3" ] && [ -s "$RUNNER_TEMP/data-encrypted/syntropy.db" ]
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | SYNTROPY_DATA_DIR="$RUNNER_TEMP/data" "desktop/dist/Syntropy Health/syntropy-health.exe" mcp | grep -q get_health_summary
      # The app itself, as someone opening it would: its server answers and its window opens (and stays open).
      - name: Smoke test the app window
        shell: pwsh
        run: |
          $env:SYNTROPY_DATA_DIR = "$env:RUNNER_TEMP\app-data"
          $app = Start-Process "desktop\dist\Syntropy Health\Syntropy Health.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $app.HasExited; $i++) {
            Start-Sleep -Seconds 1
            $app.Refresh()
            $prefs = "$env:SYNTROPY_DATA_DIR\desktop.json"     # the port it chose (8000 unless that was taken)
            $port = if (Test-Path $prefs) { (Get-Content $prefs | ConvertFrom-Json).port } else { 8000 }
            try { $up = (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/health" -TimeoutSec 2).StatusCode -eq 200 } catch { $up = $false }
            if ($up -and $app.MainWindowHandle -ne 0) { $ok = $true; break }
          }
          if ($ok) { Start-Sleep -Seconds 5; $app.Refresh(); $ok = -not $app.HasExited }
          Get-Content "$env:SYNTROPY_DATA_DIR\desktop.log" -ErrorAction SilentlyContinue
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "The app's window didn't open (exited: $($app.HasExited))" }
      # Reading a photographed lab report with the OCR built into Windows. A runner without an OCR language says so here, rather than passing quietly.
      - name: Reading a photographed lab report
        shell: bash
        run: |
          uv export --frozen --only-group dev --no-emit-project --no-header -o "$RUNNER_TEMP/dev.txt"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/dev.txt"
          python -c "from app.services import ocr; print('OCR engine:', ocr.engine())"
          python -m pytest -q tests/test_lab_ocr.py
          SYNTROPY_DATA_DIR="$RUNNER_TEMP/ocr-data" python scripts/check_app_ocr.py "desktop/dist/Syntropy Health/syntropy-health.exe" windows
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup --version=6.7.0 -y --no-progress }
          $version = python -c "from app.core.config import APP_VERSION; print(APP_VERSION)"
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" desktop\installer.iss
      # Uninstalling removes a `service install` made from the app (its sign-in task or Run value) and stops what runs
      # from its folder, but leaves a server installed from elsewhere (install.ps1 -Server) alone.
      - name: Uninstaller
        shell: pwsh
        run: |
          $setup = (Get-Item desktop\dist\*-setup.exe).FullName
          $dir = "$env:RUNNER_TEMP\Syntropy Health"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          if (-not (Test-Path $runKey)) { New-Item $runKey -Force | Out-Null }     # a fresh runner's account has none yet
          function Install {
            Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"" -Wait
            if (-not (Test-Path "$dir\Syntropy Health.exe")) { throw "Setup didn't install the app" }
          }
          function Uninstall {
            Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
            for ($i = 0; $i -lt 60 -and (Test-Path "$dir\Syntropy Health.exe"); $i++) { Start-Sleep -Seconds 1 }
            if (Test-Path "$dir\Syntropy Health.exe") { throw "The app is still there after uninstalling" }
          }
          function Task { Get-ScheduledTask -TaskName "Syntropy Health" -ErrorAction SilentlyContinue }

          # A server installed from elsewhere stays.
          Install
          $elsewhere = "C:\elsewhere\syntropy-health.exe"
          Register-ScheduledTask -TaskName "Syntropy Health" -Action (New-ScheduledTaskAction -Execute $elsewhere -Argument serve) -Trigger (New-ScheduledTaskTrigger -AtLogOn) | Out-Null
          Set-ItemProperty $runKey "Syntropy Health Server" "`"$elsewhere`" serve"
          Uninstall
          if (-not (Task)) { throw "Uninstalling removed a sign-in task that wasn't the app's" }
          if (-not (Get-ItemProperty $runKey -Name "Syntropy Health Server" -ErrorAction SilentlyContinue)) { throw "Uninstalling removed a Run value that wasn't the app's" }
          Unregister-ScheduledTask -TaskName "Syntropy Health" -Confirm:$false

          # The app's own goes, and its running server stops.
          Install
          & "$dir\syntropy-health.exe" service install --host 127.0.0.1 --port 8020
          if (-not (Task)) { throw "service install made no sign-in task" }
          Set-ItemProperty $runKey "Syntropy Health Server" "`"$dir\Syntropy Health.exe`" serve"
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            Start-Sleep -Seconds 1
            try { $up = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8020/health -TimeoutSec 2).StatusCode -eq 200 } catch {}
          }
          if (-not $up) { throw "The app's server didn't start" }
          Uninstall
          if (Task) { throw "The app's sign-in task outlived the app" }
          if (Get-ItemProperty $runKey -Name "Syntropy Health Server" -ErrorAction SilentlyContinue) { throw "The app's Run value outlived the app" }
          if (Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith("$dir\", 'OrdinalIgnoreCase') }) { throw "Something from the app's folder is still running" }
      # An update as the app does it (desktop/updater.py's script), over a running copy: the old files go, Open at Login
      # stays off, and the new version opens and answers on the same port.
      - name: Updating
        shell: pwsh
        run: |
          $version = python -c "from app.core.config import APP_VERSION; print(APP_VERSION)"
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $setup = (Get-Item desktop\dist\*-setup.exe).FullName
          & $iscc "/DAppVersion=99.0.0" "/O$env:RUNNER_TEMP\next" desktop\installer.iss
          $next = (Get-Item "$env:RUNNER_TEMP\next\*-setup.exe").FullName
          $dir = "$env:LOCALAPPDATA\Programs\Syntropy Health"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $uninstall = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6C1F3E5A-2B7D-4C8E-9A41-5D3B8F0E7C21}_is1"
          function Installed-Version { (Get-ItemProperty $uninstall).DisplayVersion }
          function Update-App($script) {
            $env:SYNTROPY_DATA_DIR = "$env:RUNNER_TEMP\update-data"
            $folder = "$env:SYNTROPY_DATA_DIR\updates"
            New-Item -ItemType Directory -Force $folder | Out-Null
            Remove-Item "$folder\update-*" -Force -ErrorAction SilentlyContinue
            '{"port": 8031}' | Set-Content "$env:SYNTROPY_DATA_DIR\desktop.json"
            $app = Start-Process "$dir\Syntropy Health.exe" -PassThru
            $up = $false
            for ($i = 0; $i -lt 120 -and -not $up; $i++) {
              Start-Sleep -Seconds 1
              try { $up = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8031/health -TimeoutSec 2).StatusCode -eq 200 } catch {}
            }
            if (-not $up) { throw "The app didn't start before updating" }
            python -c "import sys; sys.path[:0] = ['desktop', '.']; import updater; open(sys.argv[1], 'w', encoding='utf-8-sig').write(updater.WINDOWS_SCRIPT)" "$folder\apply-update.ps1"
            Start-Process powershell -WindowStyle Hidden -ArgumentList @("-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "`"$folder\apply-update.ps1`"",
              "-AppPid", "$($app.Id)", "-Setup", "`"$script`"", "-AppDir", "`"$dir`"", "-Relaunch", "window", "-Folder", "`"$folder`"", "-WatchSeconds", "180", "-GoneSeconds", "20")
            Stop-Process -Id $app.Id -Force
          }
          function Wait-Answer {
            for ($i = 0; $i -lt 180; $i++) {
              Start-Sleep -Seconds 1
              try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8031/health -TimeoutSec 2).StatusCode -eq 200) { return $true } } catch {}
            }
            return $false
          }

          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/TASKS=startup" -Wait
          if ((Installed-Version) -ne $version) { throw "Setup didn't install version $version" }
          if (-not (Test-Path "$dir\_internal")) { throw "Setup left no _internal folder" }
          Remove-ItemProperty $runKey "Syntropy Health" -ErrorAction SilentlyContinue      # the person turned Open at Login off
          "stale" | Set-Content "$dir\_internal\stale-from-the-last-version.txt"

          # The check the app makes before it installs, with the real PowerShell: on the installed app and the new version
          # (not signed here, which it allows), and reading a signature Windows itself made.
          python -c "import os, pathlib, sys; sys.path[:0] = ['desktop', '.']; import updater; sys.executable = sys.argv[1]; updater.Updater(pathlib.Path('.'), None, None, None)._check_windows(pathlib.Path(sys.argv[2])); status, signer = updater.Updater._signature(pathlib.Path(os.environ['ComSpec'])); sys.exit(0 if status == 'Valid' and signer else f'Read {status} for a signed program')" "$dir\Syntropy Health.exe" "$next"
          if ($LASTEXITCODE -ne 0) { throw "The app's signature check failed" }

          Update-App $next
          if (-not (Wait-Answer)) { Get-Content "$env:RUNNER_TEMP\update-data\desktop.log" -ErrorAction SilentlyContinue; throw "The new version didn't answer on its port" }
          (Get-Content "$env:RUNNER_TEMP\update-data\updates\setup.log" -ErrorAction SilentlyContinue) | Select-Object -Last 5
          if ((Installed-Version) -ne "99.0.0") { throw "The update didn't install 99.0.0" }
          if (Test-Path "$dir\_internal\stale-from-the-last-version.txt") { throw "The update left the old version's files behind" }
          if (Get-ItemProperty $runKey -Name "Syntropy Health" -ErrorAction SilentlyContinue) { throw "The update turned Open at Login back on" }
          Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith("$dir\", 'OrdinalIgnoreCase') } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: desktop/dist/*-setup.exe
