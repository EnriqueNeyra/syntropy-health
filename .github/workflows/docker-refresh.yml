name: Docker image refresh

# Docker users stay on the image of the last release until the next one, however long that takes. So each week the
# latest release's code is rebuilt with today's packaging from main (base image, uv.lock), and with the distribution's
# security fixes, and :latest and :1.2 move to it. Its own tests have to pass with those versions first. :1.2.3 stays as
# it was released, so a version number keeps meaning one thing; each refresh also gets its own :1.2.3-refreshed-DATE.
on:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-refresh
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/enriqueneyra/syntropy-health     # registry names are lowercase
  # What comes from main. Everything else, the app and its tests, is the release's.
  PACKAGING: Dockerfile .dockerignore pyproject.toml uv.lock scripts/docker-entrypoint.sh scripts/docker-syntropy-health.sh scripts/docker_smoke.sh scripts/release_key.py

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.latest.outputs.tag }}
          persist-credentials: false
      - name: Today's packaging on the release's code
        run: |
          git fetch --depth=1 origin main
          # shellcheck disable=SC2086  # one path per word
          git checkout FETCH_HEAD -- $PACKAGING
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.15"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: uv sync --frozen --python 3.12 --group dev
      # The packaging files' own tests belong to main's versions of them.
      - run: uv run --frozen --no-sync python -m pytest -q tests --ignore=tests/test_deployment_files.py --ignore=tests/test_install_scripts.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          no-cache: true
          tags: syntropy-health:test
      - run: sh scripts/docker_smoke.sh syntropy-health:test

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # to sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.tag }}
          persist-credentials: false
      - name: Today's packaging on the release's code
        run: |
          git fetch --depth=1 origin main
          # shellcheck disable=SC2086  # one path per word
          git checkout FETCH_HEAD -- $PACKAGING
      - name: The relay key (scripts/release_key.py)
        run: python3 scripts/release_key.py
        env:
          SYNTROPY_RELAY_KEY: ${{ secrets.SYNTROPY_RELAY_KEY }}
      - name: Which tags move
        id: tags
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          version="${TAG#v}"
          {
            echo "tags<<END"
            echo "$IMAGE:latest"
            echo "$IMAGE:${version%.*}"
            echo "$IMAGE:$version-refreshed-$(date -u +%Y%m%d)"
            echo "END"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          no-cache: true
          tags: syntropy-health:arm64
      - name: Smoke test on arm64
        run: sh scripts/docker_smoke.sh syntropy-health:arm64 linux/arm64
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish (amd64 and arm64)
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          no-cache: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Syntropy Health
            org.opencontainers.image.description=The open-source, self-hosted personal health record
            org.opencontainers.image.url=https://health.syntropylabs.io
            org.opencontainers.image.licenses=AGPL-3.0-only
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
