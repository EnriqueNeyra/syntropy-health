name: Docker image

# Publishes ghcr.io/enriqueneyra/syntropy-health for amd64 and arm64 (Raspberry Pi, ARM NAS boxes):
#   :latest, :1.2.3 and :1.2   for a release (the Release workflow starts this on the release's tag)
#   :main                      on every push to main, for trying what's next
# Pull requests build the image and run it, without publishing, and with no permission to. docker-refresh.yml brings
# :latest and :1.2 up to date each week.
# The first publish creates the package under the account's Packages. Its visibility is set there (Package settings),
# separately from the repository's.
# Published images carry an SBOM and build provenance:
#   gh attestation verify oci://ghcr.io/enriqueneyra/syntropy-health:latest -R EnriqueNeyra/syntropy-health
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/enriqueneyra/syntropy-health     # registry names are lowercase

jobs:
  # "image" is a check main requires, by this name.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: syntropy-health:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: sh scripts/docker_smoke.sh syntropy-health:test
      # Compose 2.21, which some NAS systems ship.
      - name: docker-compose.yml works on an older Compose
        run: docker run --rm -v "$PWD:/w:ro" -w /w docker:24.0.5-cli docker compose config -q

  # Not a required check: a newly published problem in the base image shouldn't hold up unrelated work, and the weekly
  # scan (supply-chain.yml) opens an issue about what's published. Fresh, so the fixes a rebuild would pick up count.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          no-cache: true
          tags: syntropy-health:scan
      - name: Known problems that have a fix
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: syntropy-health:scan
          severity-cutoff: high
          only-fixed: "true"
          output-format: table

  publish:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # to sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=Syntropy Health
            org.opencontainers.image.description=The open-source, self-hosted personal health record
            org.opencontainers.image.url=https://health.syntropylabs.io
            org.opencontainers.image.licenses=AGPL-3.0-only

      # Published images carry the relay key (scripts/release_key.py). A missing key stops here, and says what to do.
      - name: The relay key (scripts/release_key.py)
        run: python3 scripts/release_key.py
        env:
          SYNTROPY_RELAY_KEY: ${{ secrets.SYNTROPY_RELAY_KEY }}
      # A release starts from nothing cached, so it has the distribution's fixes of today.
      - name: Build for the checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          no-cache: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: syntropy-health:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The published image carries the relay key
        if: github.repository == 'EnriqueNeyra/syntropy-health'
        run: docker run --rm syntropy-health:test python -c 'from app.core import config; assert config.official_build()'
      - name: The release's tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(docker run --rm syntropy-health:test python -c 'from app.core.config import APP_VERSION; print(APP_VERSION)')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "The tag is $GITHUB_REF_NAME but APP_VERSION is $version"; exit 1; }
      # Raspberry Pis get an image that has really run. Slow under emulation, so for releases only.
      - name: Build for arm64
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          no-cache: true
          tags: syntropy-health:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test on arm64
        if: startsWith(github.ref, 'refs/tags/v')
        run: sh scripts/docker_smoke.sh syntropy-health:arm64 linux/arm64

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish (amd64 and arm64)
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
