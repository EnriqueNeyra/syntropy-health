name: Relay

# Deploys cloudflare-worker/ to Cloudflare when it changes on main, after its tests pass, so the running relay is always
# the code in this repository. Its /health reports the commit it was deployed from:
#   curl https://syntropy-auth-relay.syntropylabs.workers.dev/health
# Needs CLOUDFLARE_API_TOKEN (an "Edit Cloudflare Workers" token) and CLOUDFLARE_ACCOUNT_ID in the `relay` environment,
# which only main can use. The Oura and WHOOP client secrets stay in Cloudflare; a deploy keeps them. The healow signing
# key (CLIENT_SIGNING_KEY) is made here the first time, straight into Cloudflare, so no one ever sees or copies it.
on:
  push:
    branches: [main]
    paths: ["cloudflare-worker/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: relay
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm test
        working-directory: cloudflare-worker
      - name: Not deployed
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN isn't set in the relay environment, so nothing was deployed"
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy --var COMMIT:${{ github.sha }}
      - name: The relay has a signing key
        if: env.HAS_TOKEN == 'true'
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.147.0 secret list | grep -q CLIENT_SIGNING_KEY && exit 0
          node new-signing-key.mjs | npx --yes wrangler@4.147.0 secret put CLIENT_SIGNING_KEY
      - name: The relay answers with this commit
        if: env.HAS_TOKEN == 'true'
        run: |
          for i in $(seq 1 20); do
            curl -fs https://syntropy-auth-relay.syntropylabs.workers.dev/health | grep -q "$GITHUB_SHA" && exit 0
            sleep 3
          done
          echo "::error::The relay's /health doesn't report $GITHUB_SHA"; exit 1
      - name: The relay publishes its public key
        if: env.HAS_TOKEN == 'true'
        run: curl -fs https://syntropy-auth-relay.syntropylabs.workers.dev/jwks.json | grep -q '"kty":"RSA"'
