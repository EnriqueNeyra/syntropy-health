name: CLA

# Sets a "CLA" status on each pull request: it passes when everyone with commits in it has signed the Contributor
# License Agreement (.github/CLA.md) by posting, on this or any earlier pull request here, the comment CONTRIBUTING.md
# gives. Signing re-runs the check. pull_request_target lets it set the status on pull requests from forks; it never
# checks out or runs the pull request's code.
on:
  pull_request_target:      # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  pull-requests: read
  issues: read
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, 'I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const PHRASE = "I have read the CLA Document and I hereby sign the CLA";
            const MAINTAINERS = ["EnriqueNeyra"];
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number ?? context.issue.number;
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;

            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: number });
            const authors = new Set();
            const unlinked = [];
            for (const c of commits) {
              if (c.author?.login) authors.add(c.author.login);
              else unlinked.push(c.sha.slice(0, 7));
            }

            const signedIn = (comments, login) =>
              comments.some((c) => c.user?.login === login && c.body.trim() === PHRASE);
            const here = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
            async function signed(login) {
              if (MAINTAINERS.includes(login) || login.endsWith("[bot]")) return true;
              if (signedIn(here, login)) return true;
              // Signed on an earlier pull request?
              const q = `repo:${owner}/${repo} is:pr commenter:${login} "${PHRASE}"`;
              const { data } = await github.rest.search.issuesAndPullRequests({ q, per_page: 20 });
              for (const item of data.items) {
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: item.number });
                if (signedIn(comments, login)) return true;
              }
              return false;
            }

            const missing = [];
            for (const login of authors) if (!(await signed(login))) missing.push(login);
            const ok = missing.length === 0 && unlinked.length === 0;
            let description = "Everyone in this pull request has signed the CLA";
            if (missing.length) description = `Needs to sign: ${missing.join(", ")}`;
            else if (unlinked.length) description = `Commits not linked to a GitHub account: ${unlinked.join(", ")}`;
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, context: "CLA", state: ok ? "success" : "failure",
              description: description.slice(0, 140),
              target_url: `https://github.com/${owner}/${repo}/blob/main/.github/CONTRIBUTING.md#code-contributions`,
            });
            core.info(description);
