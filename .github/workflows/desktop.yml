name: Release

# Builds the Mac (.dmg) and Windows (setup .exe) apps. On a tag like v1.2.0 (matching APP_VERSION in app/core/config.py),
# once CI passes on it, it also publishes the GitHub release: those apps, the Python wheel and SHA256SUMS, with the
# changelog's section for that version as its notes. That's the version installers, `syntropy-health update` and the
# apps' update checks install. It then starts the Docker image's publish (docker.yml). The tag is made by
# tag-release.yml when a change to APP_VERSION is merged into main, which starts this workflow on it.
# Mac signing and notarization happen when these secrets exist in the `release` environment, which only v* tags can
# use (other builds are ad-hoc signed, and macOS asks people to allow them in System Settings → Privacy & Security):
#   MACOS_CERT_P12 (base64 of a "Developer ID Application" .p12), MACOS_CERT_PASSWORD, MACOS_SIGN_ID,
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (an app-specific password, for notarization)
# Every release file gets a signed build provenance attestation: `gh attestation verify <file> -R EnriqueNeyra/syntropy-health`.
# Changes to the desktop app build it too (on main and in pull requests), without releasing anything. To try the
# apps before a release: Actions → Release → Run workflow, then download them from the run's artifacts.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]      # (tags ignore this filter)
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A release only goes out when all of CI (tests and installer checks) passes on the tagged commit.
  tests:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A release's tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -c 'from app.core.config import APP_VERSION; print(APP_VERSION)')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::The tag is $GITHUB_REF_NAME but APP_VERSION is $version"; exit 1; }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false      # the wheel is a release file; build it without a shared cache
      - run: uv build --wheel -o dist .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: dist/*.whl

  mac:
    needs: version
    runs-on: macos-latest      # Apple silicon
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[desktop]"
      - name: Import the signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build
        env:
          PYTHON: python
          SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: desktop/build-mac.sh
      - name: Smoke test
        run: |
          "desktop/dist/Syntropy Health.app/Contents/MacOS/Syntropy Health" version
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | SYNTROPY_DATA_DIR="$RUNNER_TEMP/data" "desktop/dist/Syntropy Health.app/Contents/MacOS/Syntropy Health" mcp | grep -q get_health_summary
      # The app itself: its server answers and it opens with its window, in the Dock ("0 1": a regular app, a window
      # on screen). Opened at login (--background) it's in the menu bar only ("1 0": an accessory app, no window).
      - name: Smoke test the app window
        run: |
          app="desktop/dist/Syntropy Health.app/Contents/MacOS/Syntropy Health"
          state() {     # "<activation policy> <whether a window of the app is on screen>"
            python - "$1" <<'PY'
          import sys, AppKit, Quartz
          pid = int(sys.argv[1])
          app = AppKit.NSRunningApplication.runningApplicationWithProcessIdentifier_(pid)
          windows = Quartz.CGWindowListCopyWindowInfo(Quartz.kCGWindowListOptionOnScreenOnly, Quartz.kCGNullWindowID) or []
          shown = any(w.get("kCGWindowOwnerPID") == pid and w.get("kCGWindowLayer") == 0 for w in windows)
          print(app.activationPolicy() if app else -1, int(shown))
          PY
          }
          check() {     # check <expected state> <data folder> [arguments]
            want=$1 data=$2; shift 2
            SYNTROPY_DATA_DIR="$data" "$app" "$@" & pid=$!
            ok=
            for i in $(seq 90); do
              sleep 1
              kill -0 $pid 2>/dev/null || break
              port=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["port"])' "$data/desktop.json" 2>/dev/null || echo 8000)
              curl -sf "http://127.0.0.1:$port/health" >/dev/null || continue
              [ "$(state $pid)" = "$want" ] && { ok=1; break; }
            done
            if [ -n "$ok" ]; then sleep 5; [ "$(state $pid)" = "$want" ] || ok=; fi
            got=$(state $pid)
            cat "$data/desktop.log" 2>/dev/null || true
            kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true
            [ -n "$ok" ] || { echo "::error::Expected '$want', got '$got' (args: $*)"; exit 1; }
          }
          check "0 1" "$RUNNER_TEMP/app-window"
          check "1 0" "$RUNNER_TEMP/app-background" --background
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac
          path: desktop/dist/*.dmg

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[desktop]"
      - run: python -m PyInstaller --noconfirm --clean --distpath desktop/dist --workpath desktop/build desktop/syntropy-health.spec
      - name: Smoke test
        shell: bash
        run: |
          "desktop/dist/Syntropy Health/syntropy-health.exe" version
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | SYNTROPY_DATA_DIR="$RUNNER_TEMP/data" "desktop/dist/Syntropy Health/syntropy-health.exe" mcp | grep -q get_health_summary
      # The app itself, as someone opening it would: its server answers and its window opens (and stays open).
      - name: Smoke test the app window
        shell: pwsh
        run: |
          $env:SYNTROPY_DATA_DIR = "$env:RUNNER_TEMP\app-data"
          $app = Start-Process "desktop\dist\Syntropy Health\Syntropy Health.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $app.HasExited; $i++) {
            Start-Sleep -Seconds 1
            $app.Refresh()
            $prefs = "$env:SYNTROPY_DATA_DIR\desktop.json"     # the port it chose (8000 unless that was taken)
            $port = if (Test-Path $prefs) { (Get-Content $prefs | ConvertFrom-Json).port } else { 8000 }
            try { $up = (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/health" -TimeoutSec 2).StatusCode -eq 200 } catch { $up = $false }
            if ($up -and $app.MainWindowHandle -ne 0) { $ok = $true; break }
          }
          if ($ok) { Start-Sleep -Seconds 5; $app.Refresh(); $ok = -not $app.HasExited }
          Get-Content "$env:SYNTROPY_DATA_DIR\desktop.log" -ErrorAction SilentlyContinue
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "The app's window didn't open (exited: $($app.HasExited))" }
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $version = python -c "from app.core.config import APP_VERSION; print(APP_VERSION)"
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" desktop\installer.iss
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: desktop/dist/*-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, version, mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write        # to start the Docker image's publish
      id-token: write       # to sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Release notes from the changelog
        run: |
          awk -v h="## ${GITHUB_REF_NAME#v}" '$0 == h {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)." > notes.md
          cat notes.md
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      # The apps under fixed names, the same in every release, so scripts/install.sh, install.ps1 and the apps' updater
      # can download releases/latest/download/<name>; the release itself says which version it is. SHA256SUMS is what
      # the apps check an update against before installing it (desktop/updater.py). The wheel keeps its version in
      # its name, as Python packaging requires.
      - run: |
          mkdir release
          cp artifacts/wheel/*.whl release/
          cp artifacts/mac/*.dmg release/Syntropy-Health-mac-arm64.dmg
          cp artifacts/windows/*-setup.exe release/Syntropy-Health-windows-x64-setup.exe
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          body_path: notes.md
          make_latest: true
      # A release published with the workflow's token doesn't start other workflows, so start the image's here.
      - name: Publish the Docker image
        run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
