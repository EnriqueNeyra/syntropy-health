name: CI

# Every push to main and every pull request; the Release workflow runs it too before publishing anything.
# "CI passed" succeeds only when every job here did, so it's the one check main requires: a new job is covered by
# adding it to that job's needs, without changing the repository's rules.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release:            # the Release workflow builds the apps itself, signed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:      # a newer push to the same pull request replaces the run in progress
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -U pip && pip install --group dev
      - run: ruff check app tests desktop scripts   # version and settings in pyproject.toml
      # People see warnings from the weekly sign-in check: a release doesn't go out with old ones, and anything else is told.
      - name: The sign-in check is recent
        run: python scripts/refresh_directory.py --check-fresh 21 ${{ !inputs.release && '--warn-only' || '' }}
      # People's databases have run what's on main: a change to the schema is a new migration, never an edit.
      - name: Migrations on main are not changed
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE"
          changed=$(git diff --name-status --no-renames FETCH_HEAD HEAD -- app/core/migrations | grep -v '^A' || true)
          [ -z "$changed" ] || { echo "::error::Add a new migration instead of changing these:"; echo "$changed"; exit 1; }

  app:
    # The oldest Python pyproject.toml allows and the newest, which people installing with pip or uv often have.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: python -m pip install -U pip && pip install -e . --group dev
      - run: python -m pytest -q tests --cov --cov-report=
      # Everything on the run's summary page, and a floor under what real data depends on: not a target for the whole
      # app, which would reward tests that check little.
      - name: Coverage
        if: matrix.python == '3.12'
        run: |
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage report --skip-covered --fail-under=80 --include="app/core/auth.py,app/core/db.py,app/core/data_fixes.py,app/core/maintenance.py,app/core/security.py,app/api/deps.py,app/store/records.py,app/store/biometrics.py,app/services/insights.py,app/services/scheduler.py"

  app-mac-windows:
    # The same suite on the desktop apps' platforms. Without Tesseract, the photo-OCR tests skip; Linux covers them.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -U pip && pip install -e . --group dev
      - run: python -m pytest -q tests

  web-and-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Syntax-check web app modules
        run: for f in app/static/js/*.js app/static/js/views/*.js; do node --experimental-default-type=module --check "$f"; done
      - name: Relay worker tests
        working-directory: cloudflare-worker
        run: npm test

  linux-install:
    # The home-server installer, on a real systemd machine: install, serve, back up, update, uninstall.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --wheel -o dist .
      - run: sudo sh scripts/install.sh --source "$(ls dist/*.whl)" --no-ocr
      - run: for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 1; done; sudo journalctl -u syntropy-health --no-pager; exit 1
      # The data folder is private to the service account, so looking inside takes root.
      - run: systemctl is-active syntropy-health && sudo stat -c '%U' /var/lib/syntropy-health/syntropy.db | grep -x syntropy
      - name: Back up as the printed instructions say, into a folder only root can write to, and restore it
        run: |
          # A backup of a server nobody has set up is refused, so finish setup first.
          curl -fs -X POST localhost:8000/api/setup -H 'X-Requested-With: syntropy' -H 'Content-Type: application/json' \
            -d '{"password":"a password for ci","profile_name":"CI","accept_terms":true}'
          sudo mkdir -p /root-backups && sudo chmod 700 /root-backups
          printf 'a passphrase for ci' | sudo tee /root-pass > /dev/null
          sudo syntropy-health backup /root-backups --passphrase-file /root-pass
          sudo sh -c 'ls /root-backups/syntropy-backup-*.syntropy'
          sudo syntropy-health backup /tmp --no-encrypt && ls /tmp/syntropy-backup-*.zip
          sudo systemctl stop syntropy-health
          sudo sh -c 'syntropy-health restore /root-backups/syntropy-backup-*.syntropy --passphrase-file /root-pass --yes'
          sudo systemctl start syntropy-health
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health && break; sleep 2; done
      # The daily update timer: with automatic updates off (the default) its run checks and does nothing.
      - run: |
          systemctl is-enabled syntropy-health-update.timer
          sudo systemctl start syntropy-health-update.service
          systemctl show -p Result syntropy-health-update.service | grep -x Result=success
          sudo journalctl -u syntropy-health-update --no-pager | grep -q "Automatic updates are off"
      - run: sudo sh scripts/install.sh --source "$(ls dist/*.whl)" --no-ocr   # running it again updates in place
      - run: sudo sh scripts/install.sh --uninstall && sudo test -f /var/lib/syntropy-health/syntropy.db

  mac-install:
    # scripts/install.sh --server on a Mac: uv, the syntropy-health command, a server that answers, uninstall.
    # (The launchd service needs a logged-in session, which CI runners don't have.)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --wheel -o dist .
      - run: sh scripts/install.sh --server --no-service --no-ocr --source "$(ls dist/*.whl)"
      - run: |
          ~/.local/bin/syntropy-health serve --port 8010 &
          for i in $(seq 1 30); do curl -fs localhost:8010/health && exit 0; sleep 1; done; exit 1
      - run: |
          curl -fs -X POST localhost:8010/api/setup -H 'X-Requested-With: syntropy' -H 'Content-Type: application/json' \
            -d '{"password":"a password for ci","profile_name":"CI","accept_terms":true}'
          ~/.local/bin/syntropy-health backup "$RUNNER_TEMP" --no-encrypt && ls "$RUNNER_TEMP"/syntropy-backup-*.zip
      - run: sh scripts/install.sh --uninstall && test ! -e ~/.local/bin/syntropy-health

  windows-install:
    # scripts/install.ps1 -Server on Windows: uv, the command, the sign-in task, a server that answers, uninstall.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --wheel -o dist .
      - shell: pwsh
        run: ./scripts/install.ps1 -Server -Port 8010 -Source (Get-Item dist/*.whl).FullName
      - shell: pwsh
        run: |
          if (-not (Get-ScheduledTask -TaskName "Syntropy Health" -ErrorAction SilentlyContinue)) { throw "no sign-in task" }
          (Invoke-WebRequest -UseBasicParsing http://localhost:8010/health).Content
          & "$env:UV_TOOL_BIN_DIR\syntropy-health.exe" info --port 8010     # setup-uv moves uv's tool folder
      - shell: pwsh
        run: |
          ./scripts/install.ps1 -Uninstall
          if (Get-ScheduledTask -TaskName "Syntropy Health" -ErrorAction SilentlyContinue) { throw "task left behind" }

  apps:
    # The Mac and Windows apps, built, opened, and on Windows installed and uninstalled (apps.yml).
    if: ${{ !inputs.release }}
    uses: ./.github/workflows/apps.yml

  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, app, app-mac-windows, web-and-relay, linux-install, mac-install, windows-install, apps]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RELEASE: ${{ inputs.release }}
        run: |      # (for a release, apps is skipped)
          for result in $RESULTS; do
            [ "$result" = success ] || { [ "$result" = skipped ] && [ "$RELEASE" = true ]; } \
              || { echo "::error::Not every job passed: $RESULTS"; exit 1; }
          done
