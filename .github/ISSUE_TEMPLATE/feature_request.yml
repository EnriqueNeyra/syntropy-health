name: Idea or request
description: A data source, a chart, or anything else that would make Syntropy Health more useful.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you'd like to do
      description: The problem or situation first, then the change you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: markdown
    attributes:
      value: Planning a pull request for it? Say so here, and read [CONTRIBUTING.md](https://github.com/EnriqueNeyra/syntropy-health/blob/main/.github/CONTRIBUTING.md) first.
