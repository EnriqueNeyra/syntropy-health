version: 2
updates:
  - package-ecosystem: pip      # pyproject.toml: the app, the desktop extra and the dev group
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker      # the Python base image in the Dockerfile
    directory: /
    schedule:
      interval: weekly
