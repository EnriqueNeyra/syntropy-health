version: 2
updates:
  - package-ecosystem: uv       # uv.lock: the app, the desktop extra and the dev group. pyproject.toml keeps its ranges
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    cooldown:                   # a bad release is usually caught within days. Security updates don't wait for this
      default-days: 5
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker      # the digests of the Python base image in the Dockerfile
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*astral-sh/uv"    # moves with the installers' and workflows' uv, by hand
      # A new Python is chosen by hand, with CI's and the installers', once every dependency has wheels for it:
      # 3.15 has none for sqlcipher3 yet, so the image can't build. Digest and patch updates still come.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
